name: Scanare Imobiliare Sector 6 (Zilnic Ora 08:00)

on:
  schedule:
    # 05:15 UTC = 08:15 AM ora României (UTC+3)
    # Minutele non-rotunde (15, 23) evită cozile de așteptare aglomerate din GitHub Actions
    - cron: '15 5 * * *'
  workflow_dispatch: # Permite rulare manuală oricând din interfața GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod sursă
        uses: actions/checkout@v4

      - name: Configurare Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalare dependențe
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rulare Căutare, Trimitere Notificări & Generare Platformă Live
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -m backend.cloud_runner

      - name: Salvare baza de date și platforma web statică
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: listings database and live web platform [skip ci]"
          file_pattern: "data/listings.db docs/index.html"
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
